<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tratto — fundo de reunião</title>
<style>
  :root{
    --bg:#12171D; --bg-soft:#1A2029; --cream:#F2EFE6; --bronze:#A5763E; --grey:#8A8E92;
    --line:rgba(242,239,230,.045);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;position:relative;color:var(--cream);
       background:radial-gradient(1500px 1000px at 38% 45%, var(--bg-soft) 0%, var(--bg) 72%)}
  /* grade fina, some no centro pra não brigar com a pessoa */
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:120px 120px;
    -webkit-mask-image:radial-gradient(1100px 760px at 50% 52%,transparent 0%,transparent 30%,#000 100%)}
  /* o "ponto" da marca, enorme e discreto, saindo pela direita */
  .dot{position:absolute;right:-520px;top:-260px;width:1500px;height:1500px;
       background:radial-gradient(circle at 50% 50%, rgba(165,118,62,.16) 0%, rgba(165,118,62,.07) 22%, rgba(165,118,62,0) 50%)}
  .ring{position:absolute;right:-300px;top:-20px;width:940px;height:940px;border-radius:50%;
        border:1.5px solid rgba(165,118,62,.34)}
  .ring2{position:absolute;right:-230px;top:50px;width:800px;height:800px;border-radius:50%;
        border:1px solid rgba(165,118,62,.18)}
  .logo{position:absolute;left:84px;top:62px;width:420px;height:auto}
  .rule{position:absolute;left:96px;bottom:92px;width:120px;height:2px;background:var(--bronze);opacity:.9}
  .rule::after{content:"";position:absolute;left:0;top:0;width:1200px;height:1px;
               background:linear-gradient(90deg,rgba(165,118,62,.5),rgba(165,118,62,0))}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="dot"></div>
  <div class="ring"></div>
  <div class="ring2"></div>
  <img class="logo" src="assets/tratto-logo-cream.png" alt="Tratto. Consultoria Comercial">
  <div class="rule"></div>
</body>
</html>
